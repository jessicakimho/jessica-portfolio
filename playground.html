<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Koi Pond Playground</title>
  <meta name="theme-color" content="#12302F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="koi-pond.css">
  <style>
    /*
     * The playground: change the pond with the panel, then copy your settings into index.html.
     * Only for trying things out; your website doesn't need this file.
     */
    :root {
      --glass: rgba(16, 22, 30, 0.7);
      --line: rgba(255, 255, 255, 0.12);
      --hair: rgba(255, 255, 255, 0.08);
      --ink: #EEF1F7;
      --ink2: #AFB7C6;
      --ink3: #7B8498;
      --sky: #8EC1F2;
      --lilac: #BFB4F5;
      --blush: #F4A9C4;
      --f-body: "Geist", system-ui, -apple-system, sans-serif;
      --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #12302F;
      color: var(--ink);
      font-family: var(--f-body);
      -webkit-font-smoothing: antialiased;
    }

    #pond {
      width: 100%;
      height: 100vh;
      height: 100svh;
    }

    .center {
      position: absolute;
      inset: 0 0 6svh;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2vw, 24px);
      padding: 0 24px;
      text-align: center;
      pointer-events: none;
    }

    .center::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: -1;
      width: min(1000px, 96vw);
      height: min(46svh, 420px);
      transform: translate(-50%, -50%);
      background: radial-gradient(closest-side, rgba(6, 22, 24, 0.5), rgba(6, 22, 24, 0.2) 60%, transparent);
    }

    .title {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(56px, 11.5vw, 184px);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.025em;
      white-space: nowrap;
      color: #F3EEE6;
      text-shadow: 0 2px 22px rgba(8, 22, 24, 0.6), 0 12px 60px rgba(8, 22, 24, 0.5);
    }

    .name {
      display: inline-block;
      font-style: italic;
      padding-right: 0.06em;
      background: linear-gradient(100deg, #FBE9EF 5%, #F6B3C6 50%, #EC8FAE 95%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0;
      font-size: clamp(15px, 1.5vw, 18px);
      letter-spacing: 0.06em;
      color: rgba(250, 236, 240, 0.86);
      text-shadow: 0 1px 14px rgba(8, 22, 24, 0.75);
    }

    /* ---------- The panel ---------- */

    .panel {
      position: fixed;
      top: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      width: 330px;
      display: flex;
      flex-direction: column;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 24px;
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 30px 60px -30px rgba(0, 0, 0, 0.7);
      font-size: 13px;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s;
      user-select: none;
      -webkit-user-select: none;
    }

    .panel.closed {
      transform: translateX(calc(100% + 24px));
      opacity: 0;
      pointer-events: none;
    }

    .panel header {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--hair);
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink3);
    }

    .panel h1 {
      margin: 4px 0 2px;
      font-size: 19px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .panel header p {
      margin: 0;
      color: var(--ink2);
      font-size: 12.5px;
    }

    .controls {
      flex: 1;
      overflow-y: auto;
      padding: 6px 20px 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .controls h2 {
      margin: 18px 0 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink3);
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 4px 10px;
      padding: 6px 0;
    }

    .row label {
      color: var(--ink2);
    }

    .row output {
      font-family: var(--f-mono);
      font-size: 11.5px;
      color: var(--ink3);
    }

    .row input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      margin: 0;
      accent-color: var(--lilac);
    }

    .row input[type="color"] {
      width: 34px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: none;
      cursor: pointer;
    }

    .row input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    .row input[type="color"]::-webkit-color-swatch {
      border: 0;
      border-radius: 6px;
    }

    .row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--lilac);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 0;
    }

    .chip {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink2);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .chip:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
    }

    .chip[aria-pressed="true"] {
      background: linear-gradient(120deg, rgba(142, 193, 242, 0.28), rgba(191, 180, 245, 0.28), rgba(244, 169, 196, 0.28));
      border-color: rgba(191, 180, 245, 0.6);
      color: var(--ink);
    }

    .chip i {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--tone);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      vertical-align: -0.5px;
    }

    .panel footer {
      padding: 14px 20px 18px;
      border-top: 1px solid var(--hair);
      display: grid;
      gap: 10px;
    }

    .panel textarea {
      width: 100%;
      height: 120px;
      box-sizing: border-box;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
      color: var(--ink2);
      font-family: var(--f-mono);
      font-size: 11.5px;
      line-height: 1.5;
      user-select: text;
      -webkit-user-select: text;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .copy,
    .reset,
    .open {
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .copy {
      flex: 1;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: linear-gradient(120deg, var(--sky), var(--lilac), var(--blush));
      color: #1B2233;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset, 0 14px 28px -16px rgba(149, 134, 230, 0.8);
    }

    .copy:active,
    .reset:active,
    .open:active {
      transform: scale(0.97);
    }

    .reset {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink2);
    }

    .hint {
      margin: 0;
      color: var(--ink3);
      font-size: 11.5px;
      line-height: 1.45;
    }

    .open {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 9;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink2);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    /* On phones the panel is a sheet across the bottom. */
    @media (max-width: 700px) {
      .panel {
        top: auto;
        left: 8px;
        right: 8px;
        bottom: 8px;
        width: auto;
        max-height: 58svh;
      }

      .panel.closed {
        transform: translateY(calc(100% + 24px));
      }

      .panel textarea {
        height: 90px;
      }
    }
  </style>
</head>
<body>
  <main id="pond">
    <div class="center">
      <h1 class="title">hi, i’m <span class="name">your name</span></h1>
      <p class="subtitle">welcome to my little pond :)</p>
    </div>
  </main>

  <button class="open" type="button" hidden>Tweak the pond</button>
  <aside class="panel" aria-label="Pond settings">
    <header>
      <div class="eyebrow">Koi Pond Kit</div>
      <h1>Playground</h1>
      <p>Change anything, then copy your settings into index.html.</p>
      <button class="close" type="button" aria-label="Hide the panel">×</button>
    </header>
    <div class="controls"></div>
    <footer>
      <textarea readonly spellcheck="false" aria-label="Your settings"></textarea>
      <div class="buttons">
        <button class="copy" type="button">Copy my settings</button>
        <button class="reset" type="button">Reset</button>
      </div>
      <p class="hint">In index.html, select from <b>const look</b> down to its <b>};</b> and paste over it.</p>
    </footer>
  </aside>

  <script src="koi-pond.js"></script>
  <script>
    const holder = document.getElementById("pond");
    const panel = document.querySelector(".panel");
    const controls = document.querySelector(".controls");
    const out = document.querySelector("textarea");
    const copyButton = document.querySelector(".copy");
    const openButton = document.querySelector(".open");

    // What you've changed, on top of the preset. This is what gets copied.
    let look = { preset: "dusk" };
    let pond = KoiPond.create(holder, look);
    const narrow = () => holder.clientWidth < 700;

    const get = (obj, path) => path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
    /** A settings object holding just one value, e.g. at("water.glow", "#fff") is { water: { glow: "#fff" } }. */
    const at = (path, value) => path.split(".").reduceRight((inner, key) => ({ [key]: inner }), value);
    const isPlain = (v) => v && typeof v === "object" && !Array.isArray(v);
    const deepSet = (obj, path, value) => {
      const keys = path.split(".");
      let o = obj;
      keys.slice(0, -1).forEach((k) => {
        if (!isPlain(o[k])) o[k] = {};
        o = o[k];
      });
      o[keys[keys.length - 1]] = value;
    };

    const set = (path, value) => {
      deepSet(look, path, value);
      pond.update(at(path, value));
      write();
    };

    /** Only the settings that differ from the preset, so what you paste stays short. */
    function changes(mine, base) {
      const result = {};
      for (const key of Object.keys(mine)) {
        if (isPlain(mine[key])) {
          const inner = changes(mine[key], base[key] || {});
          if (Object.keys(inner).length) result[key] = inner;
        } else if (JSON.stringify(mine[key]) !== JSON.stringify(base[key])) {
          result[key] = mine[key];
        }
      }
      return result;
    }

    function write() {
      const base = KoiPond.resolve({ preset: look.preset });
      const diff = { preset: look.preset, ...changes(look, base) };
      const text = JSON.stringify(diff, null, 2)
        .replace(/"([a-zA-Z]\w*)":/g, "$1:")
        .replace(/\n(\s*)([}\]])/g, ",\n$1$2")
        .replace(/\[\s+([^\[\]{}]*?)\s+\]/g, (_, inner) => "[" + inner.replace(/,?\s*\n\s*/g, ", ").replace(/,\s*$/, "") + "]");
      out.value = `const look = ${text};`;
    }

    // Each control: [type, path, label, min, max, step]. "count" sliders change the phone
    // count when the pond is narrow, so you see the difference either way.
    const SECTIONS = [
      ["Water", [
        ["color", "water.middle", "Middle of the pond"],
        ["color", "water.edges", "Toward the edges"],
        ["color", "water.glow", "Reflections"],
        ["range", "water.glowAmount", "Reflection strength", 0, 3, 0.05],
        ["color", "water.light", "Sunlight"],
        ["range", "water.lightAmount", "Sunlight strength", 0, 5, 0.1],
        ["color", "water.haze", "Haze"],
        ["range", "water.hazeAmount", "Haze strength", 0, 0.6, 0.01],
        ["range", "water.sparkleAmount", "Glints", 0, 4, 0.1],
        ["range", "water.swell", "Swell", 0, 3, 0.05],
        ["color", "water.tint", "Deep water (koi fade into it)"],
        ["range", "water.sink", "How much koi fade", 0, 1.6, 0.05],
      ]],
      ["Ripples", [
        ["range", "ripples.fade", "How long ripples last", 0.95, 0.995, 0.001],
        ["range", "ripples.bend", "How much they bend the light", 0, 4, 0.05],
        ["range", "ripples.tap", "Tap splash", 0, 800, 10],
        ["range", "ripples.drag", "Drag wake", 0, 3, 0.05],
        ["range", "ripples.wake", "Koi wake", 0, 24, 0.5],
        ["check", "ripples.rain", "Raindrops"],
      ]],
      ["Koi", [
        ["types"],
        ["count", "koi", "How many", 0, 20, 1],
        ["range", "koi.size", "Size", 0.1, 0.4, 0.01],
        ["speed"],
        ["range", "koi.wiggle", "Wiggle", 0, 3, 0.05],
        ["range", "koi.wander", "Wander", 0, 3, 0.05],
        ["check", "koi.dive", "Rise and sink"],
        ["check", "koi.shy", "Swim away from the pointer"],
      ]],
      ["Lily pads & flowers", [
        ["count", "pads", "Lily pads", 0, 16, 1],
        ["range", "pads.lotusEvery", "A lotus on every … pad (0 for none)", 0, 4, 1],
        ["color", "lotus.blush", "Lotus petals"],
        ["color", "lotus.tip", "Lotus tips"],
        ["check", "pads.drops", "Water beads on the leaves"],
        ["count", "petals", "Petals", 0, 60, 1],
      ]],
    ];

    const fmt = (v, step) => (step >= 1 ? String(v) : Number(v).toFixed(step < 0.01 ? 3 : 2));

    function build() {
      controls.innerHTML = "";
      const s = pond.settings;
      const section = (title) => {
        const h = document.createElement("h2");
        h.textContent = title;
        controls.append(h);
      };
      const row = (label) => {
        const div = document.createElement("div");
        div.className = "row";
        const l = document.createElement("label");
        l.textContent = label;
        div.append(l);
        controls.append(div);
        return div;
      };
      const slider = (label, value, min, max, step, onInput) => {
        const r = row(label);
        const o = document.createElement("output");
        o.textContent = fmt(value, step);
        const input = Object.assign(document.createElement("input"), { type: "range", min, max, step, value });
        input.setAttribute("aria-label", label);
        input.addEventListener("input", () => {
          o.textContent = fmt(input.value, step);
          onInput(Number(input.value));
        });
        r.append(o, input);
      };

      section("Look");
      const presets = document.createElement("div");
      presets.className = "chips";
      for (const name of Object.keys(KoiPond.presets)) {
        const b = Object.assign(document.createElement("button"), { type: "button", className: "chip", textContent: name });
        b.setAttribute("aria-pressed", String(look.preset === name));
        b.addEventListener("click", () => {
          // A new preset starts fresh, so its own colours show.
          look = { preset: name };
          pond.destroy();
          pond = KoiPond.create(holder, look);
          build();
          write();
        });
        presets.append(b);
      }
      controls.append(presets);

      for (const [title, items] of SECTIONS) {
        section(title);
        for (const [type, path, label, min, max, step] of items) {
          if (type === "color") {
            const r = row(label);
            const input = Object.assign(document.createElement("input"), { type: "color", value: get(s, path) });
            input.setAttribute("aria-label", label);
            input.addEventListener("input", () => set(path, input.value.toUpperCase()));
            r.append(input);
          } else if (type === "range") {
            slider(label, get(s, path), min, max, step, (v) => set(path, v));
          } else if (type === "check") {
            const r = row(label);
            const input = Object.assign(document.createElement("input"), { type: "checkbox", checked: !!get(s, path) });
            input.setAttribute("aria-label", label);
            input.addEventListener("change", () => set(path, input.checked));
            r.append(input);
          } else if (type === "count") {
            const key = `${path}.${narrow() ? "countOnPhones" : "count"}`;
            slider(narrow() ? `${label} (on phones)` : label, get(s, key), min, max, step, (v) => set(key, v));
          } else if (type === "speed") {
            const base = KoiPond.resolve({ preset: look.preset }).koi.speed;
            const now = s.koi.speed;
            slider("Speed", +(now[0] / base[0]).toFixed(2), 0.3, 3, 0.05, (f) => set("koi.speed", [Math.round(base[0] * f), Math.round(base[1] * f)]));
          } else if (type === "types") {
            const chips = document.createElement("div");
            chips.className = "chips";
            for (const [name, t] of Object.entries(KoiPond.types)) {
              const b = Object.assign(document.createElement("button"), { type: "button", className: "chip" });
              b.innerHTML = `<i style="--tone:${t.saddle || t.head || (t.spots && t.spots[0] ? t.spots[0].color : t.base)}"></i>${name}`;
              b.setAttribute("aria-pressed", String(s.koi.types.includes(name)));
              b.addEventListener("click", () => {
                const chosen = new Set(pond.settings.koi.types);
                if (chosen.has(name) && chosen.size > 1) chosen.delete(name);
                else chosen.add(name);
                // Keep them in the order they're listed in the kit.
                const list = Object.keys(KoiPond.types).filter((n) => chosen.has(n));
                b.setAttribute("aria-pressed", String(chosen.has(name)));
                set("koi.types", list);
              });
              chips.append(b);
            }
            controls.append(chips);
          }
        }
      }
    }

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(out.value);
      } catch {
        out.select();
        document.execCommand("copy");
      }
      copyButton.textContent = "Copied ✓";
      setTimeout(() => (copyButton.textContent = "Copy my settings"), 1600);
    });
    document.querySelector(".reset").addEventListener("click", () => {
      look = { preset: look.preset };
      pond.destroy();
      pond = KoiPond.create(holder, look);
      build();
      write();
    });
    document.querySelector(".close").addEventListener("click", () => {
      panel.classList.add("closed");
      openButton.hidden = false;
    });
    openButton.addEventListener("click", () => {
      panel.classList.remove("closed");
      openButton.hidden = true;
    });

    build();
    write();
  </script>
</body>
</html>
