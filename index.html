<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ✏️ The name in the browser tab. -->
  <title>hi, i’m jessica</title>
  <meta name="description" content="i'm a software engineer">
  <!-- ✏️ The colour of the browser bar on phones. Match it to water.background. -->
  <meta name="theme-color" content="#12302F">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="koi-pond.css">

  <style>
    /* ---------- Your page ---------- */

    html,
    body {
      margin: 0;
      height: 100%;
      background: #12302F;
    }

    body {
      font-family: "Geist", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* The pond fills the whole screen. */
    #pond {
      width: 100%;
      height: 100vh;
      height: 100svh;
    }

    /* ---------- The words in the middle ---------- */

    .center {
      position: absolute;
      inset: 0 0 6svh;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2vw, 24px);
      padding: 0 24px;
      text-align: center;
      pointer-events: none;
    }

    /* Deeper water behind the words keeps them readable when a pale koi swims past. */
    .center::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: -1;
      width: min(1000px, 96vw);
      height: min(46svh, 420px);
      transform: translate(-50%, -50%);
      background: radial-gradient(closest-side, rgba(6, 22, 24, 0.5), rgba(6, 22, 24, 0.2) 60%, transparent);
    }

    .title {
      position: relative;
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(56px, 11.5vw, 184px);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.025em;
      white-space: nowrap;
      color: #F3EEE6;
      text-shadow: 0 2px 22px rgba(8, 22, 24, 0.6), 0 12px 60px rgba(8, 22, 24, 0.5);
    }

    .hi,
    .name {
      display: inline-block;
    }

    /* The name in italics, with a soft pink shimmer. */
    .name {
      font-style: italic;
      padding-right: 0.06em;
      background: linear-gradient(100deg, #FBE9EF 5%, #F6B3C6 50%, #EC8FAE 95%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0;
      font-size: clamp(15px, 1.5vw, 18px);
      letter-spacing: 0.06em;
      color: rgba(250, 236, 240, 0.86);
      text-shadow: 0 1px 14px rgba(8, 22, 24, 0.75);
    }

    /* The words rise out of the water when the page opens. */
    .reveal {
      animation: reveal 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) both;
      animation-delay: calc(0.25s + var(--i, 0) * 0.16s);
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(28px);
        filter: blur(14px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main id="pond">
    <div class="center">
      <!-- ✏️ Your words. -->
      <h1 class="title">
        <span class="hi reveal" style="--i: 0">hi, i’m</span>
        <span class="name reveal" style="--i: 1">jessica</span>
      </h1>
      <p class="subtitle reveal" style="--i: 2">i'm a software engineer</p>
    </div>
  </main>

  <script src="koi-pond.js"></script>
  <script>
    // ✏️ Your links. Each one is a koi with a caption that follows it around. [] for none.
    const links = [
      { label: "my work", href: "#work", koi: "gold", x: 0.36, tint: "#F0BC55", ink: "#FBE9C4" },
      { label: "say hi", href: "mailto:jho32690@usc.edu", koi: "platinum", x: 0.64, tint: "#E6ECF6", ink: "#EEF1F6" },
    ];

    // ✏️ Your look. Every setting is in the guide; anything you leave out keeps its default.
    // Find yours in playground.html, press "Copy my settings", and paste over this whole block.
    const look = {
      preset: "moonlight",
      koi: {
        types: ["sakura", "kohaku", "platinum", "asagi", "midnight"],
      },
      water: {
        middle: "#44627E",
        glowAmount: 1.3,
        hazeAmount: 0.15,
        lightAmount: 1.6,
        sparkleAmount: 1.2,
      },
    };

    KoiPond.create(document.getElementById("pond"), { ...look, links });
  </script>
</body>
</html>
